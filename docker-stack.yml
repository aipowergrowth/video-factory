# Stack para Portainer (modo Swarm). No publica ningún puerto al exterior:
# solo es alcanzable desde dentro de la red "aipowergrowthrpa" (la misma
# red donde corre n8n), por su nombre de servicio
# "fabrica-videos-engine", puerto 3001.
version: "3.8"

services:
  fabrica-videos-engine:
    image: ghcr.io/aipowergrowth/fabrica-videos-engine:latest
    environment:
      PORT: "3001"
      RENDER_CONCURRENCY: "1"
      REMOTION_CONCURRENCY: "1"
      ENABLE_MULTIPROCESS_ON_LINUX: "true"
      OUTPUTS_DIR: "/data/outputs"
      UPLOADS_JOBS_DIR: "/app/public/uploads/jobs"
      UPLOADS_VIDEOS_DIR: "/app/public/uploads/videos"
      # Credencial de la cuenta de servicio de Google Drive (acceso de
      # solo lectura a la carpeta compartida). El archivo nunca está en
      # el repo/imagen: lo monta Swarm desde el secreto de abajo.
      GOOGLE_APPLICATION_CREDENTIALS: "/run/secrets/drive_service_account_json"
      # Clave de API de Claude (Etapa 2, IA editorial). Mismo patrón que
      # la credencial de Drive: nunca en texto plano, siempre desde un
      # secreto de Swarm.
      ANTHROPIC_API_KEY_FILE: "/run/secrets/anthropic_api_key"
      # Carpeta de Drive donde se sube el MP4 final de cada job, para
      # poder revisarlo/aprobarlo sin acceso al VPS. No es una credencial
      # (el control de acceso lo da el permiso de la cuenta que autorizó
      # el OAuth de abajo, no conocer este ID), por eso va en texto plano
      # aquí y no como secreto.
      DRIVE_OUTPUT_FOLDER_ID: "1i7IBC_bCeNN9J7efE2IUfWdIZ9IZ4k0Z"
      # Las cuentas de servicio no pueden subir a un Drive personal (no
      # tienen cuota propia) -- la subida se hace con el OAuth del propio
      # Alex. El secreto es un JSON con client_id/client_secret/
      # refresh_token (ver DEPLOY.md para cómo se genera, una sola vez,
      # sin terminal).
      DRIVE_OAUTH_CREDENTIALS_FILE: "/run/secrets/drive_oauth_credentials_json"
      # Clave de API de Pixabay (Fase 3B, adquisición de broll/image).
      # Mismo patrón que las credenciales de arriba: nunca en texto
      # plano, siempre desde un secreto de Swarm.
      PIXABAY_API_KEY_FILE: "/run/secrets/pixabay_api_key"
      # Clave de API de Gemini (modelo combinado, 02-nov-2026:
      # generación de imágenes con IA como último recurso, solo cuando
      # Pixabay no encuentra nada pertinente). Mismo patrón que las
      # credenciales de arriba: nunca en texto plano. NO se usa hasta
      # que Alex confirme que este secreto existe en Portainer -- sin
      # él, esos recursos simplemente quedan pendientes, igual que hoy.
      GEMINI_API_KEY_FILE: "/run/secrets/gemini_api_key"
      # Tope de generación con IA POR VIDEO (no por recurso) -- decisión
      # explícita de Alex: 8 imágenes o $0.30, lo que ocurra primero.
      # No son secretos, solo límites de costo -- ajustables acá sin
      # tocar código ni reconstruir la imagen.
      IMAGE_GENERATION_MAX_COUNT: "8"
      IMAGE_GENERATION_MAX_COST_USD: "0.30"
    volumes:
      - fabrica_videos_inputs:/app/public/uploads
      - fabrica_videos_outputs:/data/outputs
    networks:
      - aipowergrowthrpa
    secrets:
      - drive_service_account_json
      - source: vfanthropic_api_key
        target: anthropic_api_key
      - source: drive_oauth_v2
        target: drive_oauth_credentials_json
      - source: vfpixabay_api_key
        target: pixabay_api_key
      - source: vfgemini_api_key
        target: gemini_api_key
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "4"
          memory: 6G
        reservations:
          cpus: "1"
          memory: 2G
      restart_policy:
        condition: on-failure
      update_config:
        order: stop-first

volumes:
  fabrica_videos_inputs:
  fabrica_videos_outputs:

networks:
  aipowergrowthrpa:
    external: true

secrets:
  # Creados a mano en Portainer -> Secrets (nunca en este repo). Deben
  # llamarse exactamente así (son los nombres reales en el Portainer de
  # Alex), o ajustar el mapeo de arriba también.
  drive_service_account_json:
    external: true
  # Contenido: solo la clave (sk-ant-...), sin comillas ni nombre de
  # variable delante. El secreto en Portainer se llama "vfanthropic_api_key"
  # (no "anthropic_api_key") -- el "source"/"target" de arriba hace que
  # igual quede montado en /run/secrets/anthropic_api_key, que es lo que
  # espera ANTHROPIC_API_KEY_FILE.
  vfanthropic_api_key:
    external: true
  # Contenido: un JSON de una sola línea, exactamente
  # {"client_id":"...","client_secret":"...","refresh_token":"..."}
  # (ver DEPLOY.md para cómo generarlo). El secreto en Portainer se
  # llama "drive_oauth_v2" -- el "source"/"target" de arriba lo monta
  # igual en /run/secrets/drive_oauth_credentials_json, que es lo que
  # espera DRIVE_OAUTH_CREDENTIALS_FILE.
  drive_oauth_v2:
    external: true
  # Contenido: solo la clave de Pixabay, sin comillas ni nombre de
  # variable delante -- mismo formato que vfanthropic_api_key. El
  # secreto en Portainer se llama "vfpixabay_api_key" -- el
  # "source"/"target" de arriba lo monta en /run/secrets/pixabay_api_key,
  # que es lo que espera PIXABAY_API_KEY_FILE.
  vfpixabay_api_key:
    external: true
  # Contenido: solo la clave de Gemini (nivel de pago, decisión
  # cerrada de Alex), sin comillas ni nombre de variable delante --
  # mismo formato que las demás. El secreto en Portainer debe llamarse
  # "vfgemini_api_key" -- el "source"/"target" de arriba lo monta en
  # /run/secrets/gemini_api_key, que es lo que espera
  # GEMINI_API_KEY_FILE. Sin crear este secreto, los recursos que
  # necesitarían generación quedan pendientes -- no detiene nada.
  vfgemini_api_key:
    external: true
