name: Publicar imagen Docker

# Se ejecuta solo: cada vez que se sube código a "main", GitHub construye
# la imagen y la publica en GitHub Container Registry (ghcr.io). No hace
# falta ninguna cuenta ni credencial extra: usa el token automático que
# GitHub le da a cada ejecución de Actions.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/fabrica-videos-engine:latest
