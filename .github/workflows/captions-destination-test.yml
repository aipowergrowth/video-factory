name: Subtítulos pegados según destino (Remotion real)

# Verifica, renderizando de verdad (Chrome headless real, mismo FFmpeg
# que producción), que youtube-16-9 sale SIN subtítulos pegados y
# vertical-9-16 SÍ -- decisión de Alex (31-oct-2026). No se puede probar
# esto en la máquina de desarrollo (macOS 12, sin Remotion funcional,
# ver README.md) -- por eso corre acá.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "server/subtitles.mjs"
      - "server/test-captions-render.mjs"
      - "server/render-worker.mjs"
      - "server/container-metrics.mjs"
      - "server/source-video-diagnostics.mjs"
      - "server/process-tree.mjs"
      - "server/render-diagnose.mjs"
      - "server/verbose-log-milestones.mjs"
      - "server/timeline.mjs"
      - "server/segment-planner.mjs"
      - "server/segment-render.mjs"
      - "server/segment-assemble.mjs"
      - "server/video-compare.mjs"
      - "server/test-render-observability.mjs"
      - ".github/workflows/captions-destination-test.yml"
  pull_request:
    paths:
      - "src/**"
      - "server/subtitles.mjs"
      - "server/render-worker.mjs"
      - "server/container-metrics.mjs"
      - "server/source-video-diagnostics.mjs"
      - "server/process-tree.mjs"
      - "server/render-diagnose.mjs"
      - "server/verbose-log-milestones.mjs"
      - "server/timeline.mjs"
      - "server/segment-planner.mjs"
      - "server/segment-render.mjs"
      - "server/segment-assemble.mjs"
      - "server/video-compare.mjs"
      - "server/test-render-observability.mjs"
  workflow_dispatch: {}

jobs:
  captions-render-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - name: Instalar fuente de emoji (mismo paquete que el Dockerfile de producción -- sin esto, Chromium no tiene glifos de emoji para dibujar) y un ffmpeg de sistema completo (el binario de @remotion/compositor-* viene recortado -- sin testsrc2/setpts -- solo se usa para ARMAR los videos sintéticos de prueba con patrones/VFR, nunca para el pipeline real bajo prueba, que sigue usando el ffmpeg de Remotion)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-color-emoji ffmpeg

      - name: Descargar Chrome Headless Shell (mismo paso que el Dockerfile de producción)
        run: npx remotion browser ensure

      - name: Render de prueba por destino (confirma subtítulos pegados/no pegados)
        run: node server/test-captions-render.mjs

      - name: Observabilidad del render con FFmpeg/Chrome reales (progreso, timeout, cancelación)
        run: node server/test-render-observability.mjs
